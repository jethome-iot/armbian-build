mqtt:
  host: 127.0.0.1
  port: 1883
  client_id: jethub-mqtt-io
  topic_prefix: jethub-mqtt-io
  status_payload_running: available
  status_payload_stopped: unavailable
  status_payload_dead: unavailable
  ha_discovery:
    enabled: true
    prefix: homeassistant

gpio_modules:
  - name: gpio
    module: gpiod
    chip: /dev/gpiochip0

digital_inputs:
  - name: jethub_front_button
    module: gpio
    pin: 10
    inverted: true
    poll_interval: 0.05
    ha_discovery:
      component: binary_sensor
      name: Front Button
  - name: jethub_input_1
    module: gpio
    pin: 46
    poll_interval: 0.05
    ha_discovery:
      component: binary_sensor
      name: Input 1
  - name: jethub_input_2
    module: gpio
    pin: 45
    poll_interval: 0.05
    ha_discovery:
      component: binary_sensor
      name: Input 2
  - name: jethub_input_3
    module: gpio
    pin: 44
    poll_interval: 0.05
    ha_discovery:
      component: binary_sensor
      name: Input 3
  - name: jethub_input_4
    module: gpio
    pin: 43
    poll_interval: 0.05
    ha_discovery:
      component: binary_sensor
      name: Input 4

digital_outputs:
  - name: stat_led_red
    module: gpio
    pin: 26
    inverted: true
    default: "off"
    ha_discovery:
      component: switch
      name: Status LED Red
  - name: stat_led_green
    module: gpio
    pin: 27
    inverted: true
    default: "on"
    ha_discovery:
      component: switch
      name: Status LED Green
  - name: jethub_relay_1
    module: gpio
    pin: 30
    default: "off"
    ha_discovery:
      component: switch
      name: Relay 1
  - name: jethub_relay_2
    module: gpio
    pin: 29
    default: "off"
    ha_discovery:
      component: switch
      name: Relay 2
  - name: jethub_relay_3
    module: gpio
    pin: 28
    default: "off"
    ha_discovery:
      component: switch
      name: Relay 3

options:
  convention: homeassistant
  device:
    name: JetHub D1
    manufacturer: JetHome
    model: JetHub D1
