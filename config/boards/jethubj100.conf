# Amlogic A113D quad core 512Mb/1Gb RAM SoC, eMMC 8/16Gb
BOARD_NAME="JetHub D1"
BOARD_VENDOR="jethome"
BOARDFAMILY="jethub"
BOARD_MAINTAINER="adeepn"
INTRODUCED="2021"
BOOTCONFIG="jethub_j100_defconfig"
CPUMIN=500000
CPUMAX=1416000
OFFSET=336
OVERLAY_PREFIX="meson-axg"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools python3-pip watchdog python3-serial python3-intelhex python3-intelhex mosquitto mosquitto-clients python3-yaml avahi-daemon avahi-utils"
[[ "${RELEASE}" == "jammy" ]] || PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} util-linux-extra"
DEFAULT_CONSOLE="serial"
HAS_VIDEO_OUTPUT="no"
MODULES_BLACKLIST="rtw88_8822cs"
enable_extension "jethub-burn"

function post_repo_customize_image__jethubj100_evcc() {
	display_alert "Installing evcc" "${BOARD}" "info"

	run_host_command_logged mkdir -p "${SDCARD}/usr/share/keyrings" "${SDCARD}/etc/apt/sources.list.d"
	run_host_command_logged curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL \
		"https://dl.evcc.io/public/evcc/stable/gpg.EAD5D0E07B0EC0FD.key" \
		-o "${SDCARD}/usr/share/keyrings/evcc-stable.asc"
	run_host_command_logged chmod 644 "${SDCARD}/usr/share/keyrings/evcc-stable.asc"

	cat <<- EOF > "${SDCARD}/etc/apt/sources.list.d/evcc.sources"
		Types: deb
		URIs: https://dl.evcc.io/public/evcc/stable/deb/debian
		Suites: any-version
		Components: main
		Architectures: ${ARCH}
		Signed-By: /usr/share/keyrings/evcc-stable.asc
	EOF

	do_with_retries 3 chroot_sdcard_apt_get_update
	chroot_sdcard_apt_get_install evcc

	local assets="${SRC}/packages/bsp/jethub/${BOARD}/evcc"
	local overlay="${USERPATCHES_PATH}/overlay"
	if [[ -f "${overlay}/etc/evcc.yaml" ]]; then
		run_host_command_logged install -Dm 640 "${overlay}/etc/evcc.yaml" "${SDCARD}/etc/evcc.yaml"
		chroot_sdcard chown root:evcc /etc/evcc.yaml
	fi
	if [[ -f "${overlay}/var/lib/evcc/evcc.db" ]]; then
		run_host_command_logged install -Dm 600 "${overlay}/var/lib/evcc/evcc.db" "${SDCARD}/var/lib/evcc/evcc.db"
		chroot_sdcard chown -R evcc:evcc /var/lib/evcc
	fi
	run_host_command_logged install -Dm 644 "${assets}/gpio2mqtt.conf" "${SDCARD}/etc/systemd/system/evcc.service.d/gpio2mqtt.conf"
	chroot_sdcard systemctl --no-reload enable evcc.service
}

function post_repo_customize_image__jethubj100_gpio2mqtt() {
	[[ "${ARCH}" == "arm64" ]] || exit_with_error "gpio2mqtt requires arm64"

	local version="0.2.2"
	local binary_sha256="51208cdc88b9f4ad1b9e1c14cfd5c4c4fff75b55ede0e475470ac795d4bb157a"
	local addon_revision="2905f162d9ab862adbbc4f3a15c5457362ec7c1d"
	local unexport_sha256="e3e52f3d49539ca427d3c3470e481fa2e2bc93a34fa809e3e3b81ba256c0f6e8"
	local cache_dir="${SRC}/cache/gpio2mqtt/${version}"
	local binary="${cache_dir}/gpio2mqtt-linux-arm64"
	local unexport_script="${cache_dir}/gpio-unexport-${addon_revision}.py"
	local assets="${SRC}/packages/bsp/jethub/${BOARD}/gpio2mqtt"

	display_alert "Installing gpio2mqtt" "${version}" "info"
	run_host_command_logged mkdir -p "${cache_dir}"

	if [[ ! -f "${binary}" ]] || ! echo "${binary_sha256}  ${binary}" | sha256sum --check --status; then
		local token
		token="$(curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL \
			'https://ghcr.io/token?service=ghcr.io&scope=repository:jethome-iot/gpio2mqtt-bin:pull' | jq -er '.token')" || exit_with_error "Cannot fetch gpio2mqtt registry token"
		raw_command="Download gpio2mqtt ${version}" run_host_command_logged_raw \
			curl --retry 3 --connect-timeout 10 --max-time 120 -fsSL \
			-H "Authorization: Bearer ${token}" \
			"https://ghcr.io/v2/jethome-iot/gpio2mqtt-bin/blobs/sha256:${binary_sha256}" -o "${binary}"
	fi
	echo "${binary_sha256}  ${binary}" | sha256sum --check || exit_with_error "Invalid gpio2mqtt checksum"

	if [[ ! -f "${unexport_script}" ]] || ! echo "${unexport_sha256}  ${unexport_script}" | sha256sum --check --status; then
		run_host_command_logged curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL \
			"https://raw.githubusercontent.com/jethome-hassio-addons/addon-jethub-gpio2mqtt/${addon_revision}/jethub-gpio2mqtt/rootfs/etc/gpio2mqtt/gpio-unexport.py" \
			-o "${unexport_script}"
	fi
	echo "${unexport_sha256}  ${unexport_script}" | sha256sum --check || exit_with_error "Invalid GPIO unexport checksum"

	run_host_command_logged install -Dm 755 "${binary}" "${SDCARD}/usr/local/bin/gpio2mqtt"
	run_host_command_logged install -Dm 644 "${unexport_script}" "${SDCARD}/usr/local/lib/gpio2mqtt/gpio-unexport.py"
	run_host_command_logged install -Dm 644 "${assets}/evcc-input.py" "${SDCARD}/usr/local/lib/gpio2mqtt/evcc-input.py"
	if [[ ! -f "${SDCARD}/etc/gpio2mqtt/config.yaml" ]]; then
		run_host_command_logged install -Dm 644 "${assets}/config.yaml" "${SDCARD}/etc/gpio2mqtt/config.yaml"
	fi
	run_host_command_logged install -Dm 644 "${assets}/gpio2mqtt.service" "${SDCARD}/usr/lib/systemd/system/gpio2mqtt.service"
	run_host_command_logged install -Dm 644 "${assets}/jethub-evcc-input.service" "${SDCARD}/usr/lib/systemd/system/jethub-evcc-input.service"
	chroot_sdcard systemctl --no-reload enable mosquitto.service gpio2mqtt.service jethub-evcc-input.service
}
