# JetHub D3-mini (j310) Amlogic S905y5 quad core 4Gb RAM SoC, eMMC 64Gb
BOARD_NAME="JetHub D3-mini"
BOARD_VENDOR="jethome"
BOARDFAMILY="jethub"
BOARD_MAINTAINER="QwaSeek"
BOOTCONFIG="jethub_j310_defconfig"
# Recovery A/B raw layout, ahead of the Linux rootfs partition:
#   AML inherent areas: 0–132 MiB
#   Slot A: 132–234 MiB, Slot B: 234–336 MiB
OFFSET=336
# Kernel source, branch and patchdir differ per BRANCH and are set in the
# jethubj310 block of config/sources/families/jethub.conf, which is sourced
# after this file and always wins. Setting KERNELSOURCE here unconditionally
# would make a mainline branch clone the 5.15 vendor tree while calling itself
# 7.2, because the mainline source is only substituted when it is empty.
BOOTSOURCE="https://github.com/jethome-iot/u-boot"
BOOTBRANCH_BOARD="branch:jethub_j310"
BOOTDIR="u-boot-jethub-j310"
KERNEL_TARGET="vendor,bleedingedge"
KERNEL_TEST_TARGET="vendor"
KERNEL_DRIVERS_SKIP+=(driver_rtl8811CU_rtl8821C)
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools python3-pip watchdog python3-serial python3-intelhex python3-intelhex"
[[ "${RELEASE}" == "jammy" ]] || PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} util-linux-extra"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyS0"
HAS_VIDEO_OUTPUT="no"
MODULES_BLACKLIST="rtw88_8822cs"
enable_extension "jethub-burn"
